# AURUM na nuvem: analisa os ativos de cloud_config.json e avisa no Telegram, com o PC desligado.
# Só lê dados de mercado e manda mensagens — não acessa corretora nem executa ordens.
# Horários em UTC (Brasília = UTC-3). Entradas no M15: roda 4 min depois do fechamento de cada candle de 15 min
# no horário mais líquido. ~1.300 execuções/mês: grátis sem limite em repositório público; em repositório
# privado (2.000 min/mês) pode passar da cota — nesse caso o GitHub só pausa as execuções até o mês seguinte.
# O GitHub pode atrasar execuções agendadas alguns minutos nos horários de pico.
name: AURUM nuvem

#
# DESLIGADO: os secrets TELEGRAM_TOKEN e TELEGRAM_CHAT_ID ainda não foram criados no repositório, então cada
# execução falhava e o GitHub mandava um e-mail a cada 15 min. Para ligar: crie os dois secrets
# (Settings → Secrets and variables → Actions), apague o "#" das 4 linhas de schedule abaixo e faça o push.
on:
  # schedule:
  #   - cron: "4,19,34,49 10-19 * * 1-5"  # seg–sex 07h–16h45 de Brasília: a cada candle de 15 min
  #   - cron: "4 0-9,20-23 * * 1-5"       # seg–sex fora desse horário: de hora em hora
  #   - cron: "4 */2 * * 0,6"             # sábado e domingo, a cada 2 horas (cripto não para)
  workflow_dispatch:         # botão "Run workflow" para testar na hora

permissions:
  contents: read

concurrency:
  group: aurum-nuvem
  cancel-in-progress: false

jobs:
  varredura:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Instalar dependências
        run: pip install -r requirements-cloud.txt

      - name: Recuperar o estado da última execução
        uses: actions/cache/restore@v6
        with:
          path: cloud_state
          key: aurum-state-${{ github.run_id }}
          restore-keys: aurum-state-

      - name: Analisar e avisar no Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AURUM_DATA_DIR: ${{ runner.temp }}/aurum-data
          PYTHONIOENCODING: utf-8
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Secrets TELEGRAM_TOKEN e TELEGRAM_CHAT_ID não configurados: nada foi enviado."
            exit 0
          fi
          python -m app.cloud

      - name: Guardar o estado para a próxima execução
        if: always() && hashFiles('cloud_state/state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: cloud_state
          key: aurum-state-${{ github.run_id }}
